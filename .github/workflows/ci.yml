name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Install GNU Emacs
        if: matrix.python-version == '3.12'
        run: |
          brew install emacs
          emacs --version

      - name: Check dependency lock
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: >-
          uv run pytest
          --cov=friction
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Test Emacs integration
        if: matrix.python-version == '3.12'
        run: |
          emacs --batch -Q -L integrations/emacs \
            -l tests/emacs/friction-test.el -f ert-run-tests-batch-and-exit
          emacs --batch -Q --eval \
            '(progn (require (quote bytecomp)) (let ((byte-compile-error-on-warn t) (byte-compile-dest-file-function (lambda (_) (expand-file-name "friction.elc" temporary-file-directory)))) (byte-compile-file "integrations/emacs/friction.el")))'

      - name: Build package
        run: |
          uv build --clear
          uv run python scripts/verify_release.py

      - name: Smoke-test installed package
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/friction-bin
          UV_TOOL_DIR: ${{ runner.temp }}/friction-tools
        run: |
          uv tool install dist/*.whl
          "$UV_TOOL_BIN_DIR/friction" --version
          "$UV_TOOL_BIN_DIR/friction" tui --help
          "$UV_TOOL_BIN_DIR/friction" mcp --help
          "$UV_TOOL_BIN_DIR/friction" --db "$RUNNER_TEMP/friction-ci.db" doctor --output json
          "$UV_TOOL_BIN_DIR/friction" --db "$RUNNER_TEMP/friction-ci.db" import-jsonl tests/fixtures/jsonl/legacy.jsonl --dry-run --output json
