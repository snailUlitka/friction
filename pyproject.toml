[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "friction"
version = "0.1.1"
description = "Local-first workflow-friction tracker"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mikhail Polevoda" },
]
requires-python = ">=3.12"
keywords = ["cli", "local-first", "mcp", "productivity", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "alembic>=1.15,<2",
    "mcp>=1.28,<2",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "textual>=8.2,<9",
    "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/snailUlitka/friction"
Repository = "https://github.com/snailUlitka/friction.git"
Issues = "https://github.com/snailUlitka/friction/issues"

[project.scripts]
fr = "friction.cli:main"
friction = "friction.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.11.0,<0.12.0"
exclude-newer = "7 days"

[tool.uv.build-backend]
source-include = [
    "docs/**",
    "integrations/emacs/**",
    "tests/**",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["friction"]

[tool.coverage.run]
branch = true
source = ["friction"]
omit = ["src/friction/storage/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
