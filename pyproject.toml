[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "friction"
version = "0.1.0"
description = "Local-first workflow-friction tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "textual>=8.2,<9",
    "typer>=0.15,<1",
]

[project.scripts]
fr = "friction.cli:main"
friction = "friction.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.11.0,<0.12.0"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["friction"]

[tool.coverage.run]
branch = true
source = ["friction"]
omit = ["src/friction/storage/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
